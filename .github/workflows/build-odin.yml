name: Build odin kernel (HyperOS port)

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: "Appended to the kernel release string"
        default: "-odin-hyperos"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 bc bison flex libssl-dev libelf-dev cpio python3 device-tree-compiler
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            sudo ln -sf /usr/bin/$t-18 /usr/local/bin/$t
          done
          clang --version | head -1

      - name: Configure
        run: |
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 TARGET_PRODUCT=odin odin_defconfig
          scripts/config --file out/.config --set-str LOCALVERSION "${{ inputs.localversion }}" -d LOCALVERSION_AUTO
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 TARGET_PRODUCT=odin olddefconfig

      - name: Build
        run: |
          rc=0
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 TARGET_PRODUCT=odin -j$(nproc) > build.log 2>&1 || rc=$?
          grep -E 'error:|Error [0-9]|Kernel: ' build.log | head -60
          exit $rc

      - name: Collect
        run: |
          mkdir -p dist/modules
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 TARGET_PRODUCT=odin INSTALL_MOD_PATH=$PWD/dist/modules INSTALL_MOD_STRIP=1 modules_install
          cp out/arch/arm64/boot/Image dist/
          mkdir -p dist/dts
          find out/arch/arm64/boot/dts -name '*.dtb' -o -name '*.dtbo' | xargs -I{} cp {} dist/dts/
          cp out/.config dist/config
          cat out/include/config/kernel.release > dist/kernel.release
          tail -200 build.log > dist/build-tail.log
          ls dist dist/dts | head -100

      - uses: actions/upload-artifact@v4
        with:
          name: odin-kernel
          path: dist
          retention-days: 7

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
